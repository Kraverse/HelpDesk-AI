name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/project-foundation]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=moderate

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Ruff lint
        run: ruff check app tests
      - name: Ruff format check
        run: ruff format --check app tests
      - name: Unit tests
        run: pytest
      - name: Application import/startup check
        run: python -c "from app.main import app; assert app.title == 'HelpDesk AI API'; print('FastAPI application import succeeded')"

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-audit.txt
      - name: Install pinned audit tooling
        run: python -m pip install --requirement backend/requirements-audit.txt
      - name: Audit backend dependency lock
        run: pip-audit --requirement backend/requirements.txt
      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare local environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start development services
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Smoke-test frontend and backend
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/tmp/backend-health.json \
              && grep -q '"status":"ok"' /tmp/backend-health.json \
              && curl --fail --silent http://127.0.0.1:3000/api/health >/tmp/frontend-health.json \
              && grep -q '"status":"ok"' /tmp/frontend-health.json \
              && curl --fail --silent http://127.0.0.1:3000/ | grep -q 'Answers grounded'; then
              cat /tmp/backend-health.json
              cat /tmp/frontend-health.json
              echo "Frontend and backend smoke tests passed"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          echo "Timed out waiting for the development services" >&2
          exit 1
      - name: Stop services
        if: always()
        run: docker compose down --volumes
